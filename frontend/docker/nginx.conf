# InsureHub frontend — nginx serving the Vite build.
#
# The app's vite base is /insurehub/, so everything lives under that path.
# The SPA fallback (try_files → index.html) is what makes deep-links like
# /insurehub/policies/123/edit resolve without a 404.

server {
    listen 80;
    server_name _;

    # Compression for text-y assets. Static gzip files would be even better
    # but Vite doesn't emit them by default.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Long-cache the hashed asset files (Vite puts a content hash in every
    # filename, so cache-busting is automatic).
    location ~* ^/insurehub/assets/.+\.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Everything else under /insurehub → SPA fallback.
    location /insurehub/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /insurehub/index.html;

        # index.html itself must NOT be cached — otherwise clients keep
        # loading old asset hashes after a deploy.
        location = /insurehub/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Bare `/` → redirect into the app.
    location = / {
        return 302 /insurehub/;
    }

    # Basic security headers (Coolify's proxy may add more).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
