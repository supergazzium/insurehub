# Dev-mode compose override — layer on top of compose.yaml to get
# hot-module-reload on the frontend without rebuilding the container
# for every code change.
#
# Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# What this changes vs compose.yaml (frontend service only):
#   • Builds the `dev` stage of frontend/Dockerfile instead of `runtime`
#     (so it runs `vite --host` instead of nginx serving a static build).
#   • Bind-mounts ./frontend into /app so file edits inside the source
#     tree are picked up by Vite's file watcher.
#   • Mounts node_modules as a named volume so the host's node_modules
#     (if any) doesn't shadow the container's dependency install.
#   • Serves via Vite on 5173 → mapped to host 5173.
#
# mysql + backend services are inherited from compose.yaml unchanged.
#
# NOTE: Coolify builds compose.yaml only. This file is dev-only.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      # No build-args needed — Vite reads VITE_* at runtime in dev.
      args: []
    # Vite dev server needs env vars too, not build args.
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_APP_URL: http://localhost:5173
    volumes:
      # Bind-mount source. Everything Vite watches lives here.
      - ./frontend:/app
      # Named volume for node_modules so the host directory (if it
      # exists from a local `npm install`) doesn't overwrite the
      # container's install, which was built for alpine/musl.
      - frontend_node_modules:/app/node_modules
    # Override the prod port mapping. compose.yaml maps host:5173 →
    # container:80 (nginx). In dev, Vite listens on 5173 inside the
    # container, so the mapping needs to line up.
    ports: !override
      - "5173:5173"
    # Vite dev server logs are noisy; keep them attached during dev
    # so the operator sees compile errors immediately.
    tty: true
    stdin_open: true

volumes:
  frontend_node_modules:
