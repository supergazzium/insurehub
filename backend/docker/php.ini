; Runtime PHP config for InsureHub backend (prod).
; Loaded via /usr/local/etc/php/conf.d/zz-app.ini so it overrides
; anything from the base image.

; ── Timezone ────────────────────────────────────────────────────────────
date.timezone = Asia/Bangkok

; ── Uploads & post size (policy documents, ID cards, etc.) ─────────────
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20
memory_limit = 256M

; ── Request time ────────────────────────────────────────────────────────
max_execution_time = 60
max_input_time = 60

; ── Sessions (we use database driver via Laravel; keep PHP session defaults tight) ──
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; ── OPcache — critical for Laravel throughput ──────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; validate_timestamps=0 means the image is the source of truth; a redeploy
; must ship a new image for any code change to take effect.
opcache.validate_timestamps = 0
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; ── Expose only the "InsureHub" server header, not PHP version ─────────
expose_php = 0

; ── Errors — logged, not displayed ─────────────────────────────────────
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /dev/stderr
